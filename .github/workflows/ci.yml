name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check Netlify functions / lib / db
        run: npm run typecheck

      - name: Syntax-check index.html inline script
        run: npm run check-index-syntax

      - name: DbSync merge-safety regression test
        run: npm run test:dbsync-merge

      - name: Server-side scoring regression test
        run: npm run test:score-record
